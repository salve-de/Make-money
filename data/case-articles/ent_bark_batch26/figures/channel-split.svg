<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" aria-labelledby="title desc"><title id="title">売上の85.9%は直接販売</title><desc id="desc">2025年3月期BARK全社売上の内訳：直接販売85.9%、小売と提携通販14.1%。</desc><rect width="680" height="610" fill="#0c0e11"/><g font-family='-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif'><text x="25" y="55" fill="#f5f6f8" font-size="34" font-weight="750">売上の85.9%は直接販売</text><text x="25" y="95" fill="#aeb6bd" font-size="27">定期便を中心に、小売にも販路を広げた</text><text x="28" y="180" fill="#ffac41" font-size="24" font-weight="700">直接販売</text><text x="525" y="180" fill="#fff" font-size="24" font-weight="750">85.9%</text>
<rect x="25" y="197" width="630" height="55" rx="6" fill="#333940"/><rect x="25" y="197" width="541.17" height="55" rx="6" fill="#ff9f1a"/>
<text x="28" y="311" fill="#d5dde4" font-size="24" font-weight="700">小売・提携通販</text><text x="525" y="311" fill="#fff" font-size="24" font-weight="750">14.1%</text>
<rect x="25" y="330" width="630" height="55" rx="6" fill="#333940"/><rect x="25" y="330" width="88.83" height="55" rx="6" fill="#889aa8"/>
<path d="M25 439 H655" stroke="#343a40"/><text x="25" y="479" fill="#e2e6ea" font-size="24">BARK全社売上：4億8,418万ドル</text><text x="25" y="516" fill="#aeb6bc" font-size="22">約726億円 ／ 2025年3月期</text>
<text x="25" y="575" fill="#8c97a1" font-size="18">出典：BARK 2025年度 Form 10-K（SEC）</text></g></svg>
