<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">キットの代金に、材料と解説動画の両方が含まれる</title><desc id="desc">キットの代金と、購入者が受け取るもの。</desc>
