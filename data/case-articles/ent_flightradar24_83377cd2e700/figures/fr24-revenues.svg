<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">同じ情報基盤に、三つの支払者</title><desc id="desc">事実に基づく自作説明図。数値の比率を表すものではない。</desc>
