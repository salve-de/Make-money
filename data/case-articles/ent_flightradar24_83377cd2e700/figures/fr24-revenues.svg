<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">同じ飛行データから、3通りの売上を得る</title><desc id="desc">広告主、有料会員、企業の3者が払う代金。</desc>
<rect width="1040" height="530" fill="#0c0e11"/>
<text x="24" y="31" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="600" fill="#ffac3b" text-anchor="start">FLIGHTRADAR24  /  収入源</text>
<text x="24" y="65" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="600" fill="#f0f2f5" text-anchor="start">同じ飛行データから、3通りの売上を得る</text>
<text x="24" y="102" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" fill="#b8c0cc" text-anchor="start">地図は無料で見られる。広告主、有料会員、企業が代金を払う。</text>
