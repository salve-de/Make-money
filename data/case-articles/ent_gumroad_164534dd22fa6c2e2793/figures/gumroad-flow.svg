<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="470" version="1.1" viewBox="0 0 1120 470" width="1120">
  <defs/>
  <rect fill="#0d1015" height="100%" width="100%" x="0" y="0"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" x="40" y="52">売り手が商品を用意し、決済と商品の受け渡しはGumroadが行う</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" x="40" y="86">手数料は、売れ方によって2通り</text>
  <rect fill="#171b22" height="152" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="285" x="40" y="118"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="600" x="58" y="154">売り手</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="58" y="194">商品を登録し、価格を決める</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="58" y="221">自分のファンに案内する</text>
  <rect fill="#171b22" height="152" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="285" x="420" y="118"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="600" x="438" y="154">Gumroad</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="438" y="194">販売ページ・決済・受け渡し</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="438" y="221">売り手への送金、税の手続き</text>
  <rect fill="#171b22" height="152" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="280" x="800" y="118"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="600" x="818" y="154">購入者</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="818" y="194">商品を買う</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="818" y="221">代金を払い、商品を受け取る</text>
  <line stroke="#79acc8" stroke-width="2.1" x1="327" x2="416" y1="170" y2="170"/>
  <polygon fill="#79acc8" points="416,170 406.9955289764732,174.3496553411123 406.9955289764732,165.6503446588877"/>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="372" y="160">商品とリンク</text>
  <line stroke="#eeab58" stroke-width="2.1" x1="799" x2="711" y1="194" y2="194"/>
  <polygon fill="#eeab58" points="711,194 720.0044710235268,189.6503446588877 720.0044710235268,198.3496553411123"/>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="755" y="182">注文・代金</text>
  <line stroke="#9dc29f" stroke-width="2.1" x1="710" x2="796" y1="231" y2="231"/>
  <polygon fill="#9dc29f" points="796,231 786.9955289764732,235.3496553411123 786.9955289764732,226.6503446588877"/>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="753" y="257">商品を渡す</text>
  <rect fill="#202632" height="110" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="1040" x="40" y="310"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="600" x="59" y="347">Gumroadの手数料</text>
  <text fill="#eeab58" font-family="Noto Sans CJK JP, sans-serif" font-size="17" font-weight="600" x="60" y="383">売り手が案内した注文：10% + $0.50 / 件</text>
  <text fill="#79acc8" font-family="Noto Sans CJK JP, sans-serif" font-size="17" font-weight="600" x="603" y="383">Discoverで見つけた注文：30% / 件</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400" x="60" y="410">売り手が案内した注文は、決済手数料が別にかかる。2026年10月時点。</text>
</svg>
