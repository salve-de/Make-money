  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" x="40" y="52">商品は販売者が用意し、決済と納品をGumroadが処理</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" x="40" y="86">二つの販売経路で異なる手数料を設定</text>
