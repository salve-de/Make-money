<svg xmlns="http://www.w3.org/2000/svg" width="680" height="665" viewBox="0 0 680 665" role="img" aria-labelledby="title desc"><title id="title">水温で硬さが変わるスポンジ</title><desc id="desc">冷水で硬くなり汚れをこすり、温水で柔らかくなり形に沿って洗える</desc><rect width="680" height="665" fill="#0c0e11"/><g font-family='-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif'><text x="25" y="55" fill="#f5f6f8" font-size="34" font-weight="750">水温で硬さが変わるスポンジ</text><text x="25" y="95" fill="#aeb6bd" font-size="27">同じ商品を、洗い方に合わせて使い分ける</text><rect x="25" y="141" width="630" height="202" rx="11" fill="#172029" stroke="#43637f"/><text x="47" y="192" fill="#a9d4ff" font-weight="700" font-size="32">冷たい水</text><text x="47" y="246" fill="#fff" font-size="42" font-weight="700">硬くなる</text><text x="47" y="300" fill="#c3cbd3" font-size="29">頑固な汚れをしっかりこする</text>
<rect x="25" y="369" width="630" height="202" rx="11" fill="#292019" stroke="#7a5330"/><text x="47" y="420" fill="#ffbd7f" font-weight="700" font-size="32">温かい水</text><text x="47" y="474" fill="#fff" font-size="42" font-weight="700">柔らかくなる</text><text x="47" y="528" fill="#c3cbd3" font-size="29">食器や道具の形に沿って洗う</text><text x="25" y="628" fill="#94a0aa" font-size="18">出典：Scrub Daddy公式の製品説明</text></g></svg>
