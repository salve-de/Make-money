<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Sleep Jarの利用と課金</title><desc id="d">利用者はAlexaかスマホアプリから睡眠音を再生。基本機能は無料で、長時間の途切れない再生・高音質・限定コンテンツにはプレミアム会員がある。</desc><rect width="1100" height="420" fill="#0b0c0e"/><g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#f2f3f4"><text x="32" y="54" font-size="30" font-weight="700">睡眠音を届け、必要な人だけが有料会員に</text><text x="32" y="89" font-size="17" fill="#a5aab0">Alexaで始まり、iPhone・Androidにも展開</text></g><g fill="#17191c" stroke="#41454b" stroke-width="2"><rect x="30" y="137" width="256" height="176" rx="12"/><rect x="353" y="137" width="342" height="176" rx="12"/><rect x="765" y="137" width="305" height="176" rx="12"/></g><g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" text-anchor="middle"><text x="158" y="189" font-size="30" font-weight="700" fill="#fff">利用者</text><text x="158" y="232" font-size="22" fill="#cbd0d3">眠る時に音が欲しい</text><text x="524" y="185" font-size="30" font-weight="700" fill="#fff">Sleep Jar</text><text x="524" y="221" font-size="20" fill="#d6d9de">Alexa／スマホで再生</text><text x="524" y="262" font-size="24" font-weight="700" fill="#ff9f1a">無料の環境音</text><text x="917" y="185" font-size="29" font-weight="700" fill="#fff">プレミアム会員</text><text x="917" y="222" font-size="20" fill="#d6d9de">10時間途切れない音</text><text x="917" y="253" font-size="20" fill="#d6d9de">高音質・限定コンテンツ</text></g><path d="M289 224 H347" stroke="#ff9f1a" stroke-width="4" fill="none"/><path d="m336 213 13 11-13 11" fill="none" stroke="#ff9f1a" stroke-width="4"/><path d="M701 224 H759" stroke="#ff9f1a" stroke-width="4" fill="none"/><path d="m748 213 13 11-13 11" fill="none" stroke="#ff9f1a" stroke-width="4"/><g fill="#929aa2" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="17"><text x="32" y="371">※ 図はサービスの仕組みを説明するもの。利用者全員が課金することを示していない。</text><text x="32" y="396">出典：Sleep Jar公式Premium・Amazon Developer（2022年）</text></g></svg>