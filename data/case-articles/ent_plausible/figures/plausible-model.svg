<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="470" version="1.1" viewBox="0 0 1120 470" width="1120">
  <defs/>
  <rect fill="#0d1015" height="100%" width="100%" x="0" y="0"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" x="40" y="52">使い方は2通り。有料で任せるか、無料で自分で動かすか</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" x="40" y="86">Plausibleの売上になるのは、月額を払って任せる人の分だけ</text>
  <rect fill="#171b22" height="145" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="248" x="40" y="123"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" x="58" y="159">サイト運営者</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="58" y="195">自分のサイトの</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="58" y="221">訪問者数を調べたい</text>
  <rect fill="#171b22" height="145" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="248" x="322" y="123"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" x="340" y="159">Plausible（有料版）</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="340" y="195">計測と集計、画面の表示</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="340" y="221">サーバーの管理と更新</text>
  <rect fill="#171b22" height="145" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="248" x="604" y="123"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" x="622" y="159">月額の利用料</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="622" y="195">サイトの数と閲覧数で決まる</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="622" y="221">これがPlausibleの売上</text>
  <line stroke="#eeab58" stroke-width="2.1" x1="287" x2="319" y1="194" y2="194"/>
  <polygon fill="#eeab58" points="319,194 309.9955289764732,198.3496553411123 309.9955289764732,189.6503446588877"/>
  <line stroke="#eeab58" stroke-width="2.1" x1="569" x2="601" y1="194" y2="194"/>
  <polygon fill="#eeab58" points="601,194 591.9955289764732,198.3496553411123 591.9955289764732,189.6503446588877"/>
  <rect fill="#202632" height="145" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="190" x="886" y="123"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" x="905" y="159">無料版</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="905" y="194">公開プログラムを</text>
  <text fill="#b7c0c9" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" x="905" y="221">自分のサーバーで動かす</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" x="888" y="290">サーバーの管理は自分で行う</text>
  <rect fill="#202632" height="111" rx="9" ry="9" stroke="#343c46" stroke-width="1.1" width="1036" x="40" y="303"/>
  <text fill="#f0f2f4" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="600" x="60" y="341">有料契約までの流れ</text>
  <text fill="#79acc8" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="600" x="60" y="373">2019年 試作版を公開</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="280" y="373">→</text>
  <text fill="#79acc8" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="600" x="320" y="373">2020年 記事がHacker Newsで1位</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="592" y="373">→</text>
  <text fill="#79acc8" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="600" x="632" y="373">検索から来た人が無料体験</text>
  <text fill="#8895a3" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" x="846" y="373">→</text>
  <text fill="#9dc29f" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="600" x="880" y="373">有料契約</text>
</svg>
