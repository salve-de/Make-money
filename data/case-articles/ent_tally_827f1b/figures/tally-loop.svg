<text x="24" y="65" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="600" fill="#f0f2f5" text-anchor="start">無料のフォームが、次の入口になる</text>
<text x="24" y="102" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" fill="#b8c0cc" text-anchor="start">フォームが外に配られるたび、作成ツールも知られる。</text>
