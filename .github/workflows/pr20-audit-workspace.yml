name: PR20 audit workspace

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  workspace:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package source and locked dependencies for isolated audit
        run: |
          tar -czf "$RUNNER_TEMP/pr20-workspace.tar.gz" --exclude=.git --exclude=node_modules/.cache .
      - uses: actions/upload-artifact@v4
        with:
          name: pr20-audit-workspace
          path: ${{ runner.temp }}/pr20-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
