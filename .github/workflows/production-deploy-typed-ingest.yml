name: Cloudflare credential presence audit

on:
  push:
    branches:
      - codex/production-deploy-typed-ingest-20260924

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      S_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
      S_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      S_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      S_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
      V_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      V_CF_ACCOUNT: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for n in S_API_TOKEN S_CF_TOKEN S_API_KEY S_EMAIL S_ACCOUNT S_CF_ACCOUNT V_ACCOUNT V_CF_ACCOUNT; do
            if [ -n "${!n}" ]; then echo "$n=present"; else echo "$n=absent"; fi
          done
