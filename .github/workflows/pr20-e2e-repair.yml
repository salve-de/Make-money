name: PR20 browser contract repair
on:
  pull_request:
    paths:
      - scripts/audit/pr20-e2e-repair.mjs
      - .github/workflows/pr20-e2e-repair.yml
permissions:
  contents: write
concurrency:
  group: pr20-browser-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit/pr20-e2e-repair.mjs
      - name: Commit exact guarded repairs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          branch=refactor/100yr-clean-architecture
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e src/features/company-inspector/ui/CashAnatomySection.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(pr20): retain browser behavior contracts on the current inspector and guard incomplete cash inputs'
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "TESTED_SOURCE_SHA=$(git rev-parse HEAD)"
      - run: pnpm lint
      - if: always()
        run: pnpm typecheck
      - if: always()
        run: pnpm test
      - id: build
        if: always()
        run: pnpm build && pnpm bundle:workers
      - if: steps.build.outcome == 'success'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.build.outcome == 'success'
        run: pnpm exec playwright test --retries=0 --reporter=list,./verification/ci-reporter.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr20-browser-diagnostics
          path: test-results/
          retention-days: 7
