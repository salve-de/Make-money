name: finalize-v2

on:
  push:
    branches: [feat/perfect-polish]
    paths:
      - release/finalize-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final integration patch
        run: node scripts/finalize-v2.mjs

      - name: Install and verify browser application
        run: |
          npm ci --ignore-scripts
          npm run verify

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check --no-config supabase/functions/url-preview/index.ts
          deno check --no-config supabase/functions/stripe-checkout/index.ts
          deno check --no-config supabase/functions/stripe-portal/index.ts
          deno check --no-config supabase/functions/stripe-webhook/index.ts
          deno check --no-config supabase/functions/newsletter-subscribe/index.ts
          deno check --no-config supabase/functions/newsletter-confirm/index.ts
          deno check --no-config supabase/functions/newsletter-unsubscribe/index.ts
          deno check --no-config supabase/functions/send-digest/index.ts

      - name: Smoke test static application
        run: |
          npm run dev > /tmp/goldmine-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/goldmine-index.html; then break; fi
            sleep 1
          done
          grep -q 'GOLDMINE RADAR' /tmp/goldmine-index.html
          curl --fail --silent http://127.0.0.1:4173/src/v2/app.js | grep -q 'applyLiveDataset'
          curl --fail --silent http://127.0.0.1:4173/styles/v2.css | grep -q 'prefers-reduced-motion'

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "feat: finalize GOLDMINE RADAR v3 platform"
            git push origin HEAD:feat/perfect-polish
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: goldmine-radar-v3-source
          path: |
            .
            !node_modules
            !.git
          retention-days: 7
