project_id = "goldmine-radar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_signup = true

[functions.url-preview]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false

[functions.newsletter-confirm]
verify_jwt = false

[functions.newsletter-unsubscribe]
verify_jwt = false

[functions.send-digest]
verify_jwt = false
