<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="h d"><title id="h">水温によってスポンジの硬さが変わる</title><desc id="d">冷水では硬く、温水では柔らかくなる。Scrub Daddy公式情報。</desc><rect width="960" height="380" fill="#101113"/><g font-family="-apple-system,Hiragino Sans,sans-serif"><text x="28" y="55" font-size="31" font-weight="700" fill="#f5f6f8">水の温度で、洗い方を変えられる</text><rect x="28" y="111" width="431" height="201" rx="8" fill="#17202a" stroke="#527b9a"/><rect x="499" y="111" width="431" height="201" rx="8" fill="#291e18" stroke="#b2763f"/><g text-anchor="middle"><text x="242" y="172" font-size="34" fill="#bfdfff" font-weight="700">冷水</text><text x="242" y="224" font-size="28" fill="#fff" font-weight="700">硬くなる</text><text x="242" y="267" font-size="21" fill="#c8cdd3">汚れをしっかりこする</text><text x="714" y="172" font-size="34" fill="#ffdab4" font-weight="700">温水</text><text x="714" y="224" font-size="28" fill="#fff" font-weight="700">柔らかくなる</text><text x="714" y="267" font-size="21" fill="#c8cdd3">食器を優しく洗う</text></g><text x="28" y="353" font-size="17" fill="#acb3b9">出典：Scrub Daddy公式 FlexTexture（独自図解）</text></g></svg>
