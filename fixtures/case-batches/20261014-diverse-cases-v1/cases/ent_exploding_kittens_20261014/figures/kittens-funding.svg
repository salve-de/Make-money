<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="h d"><title id="h">発売前に219382人が支援したExploding Kittens</title><desc id="d">目標1万ドルに対し878万2571ドルが集まった。支援金は利益ではない。</desc><rect width="960" height="390" fill="#101113"/><g font-family="-apple-system,Hiragino Sans,sans-serif"><text x="28" y="51" font-size="29" fill="#f6f7f8" font-weight="700">発売前に21万9,382人が支援</text><text x="28" y="87" font-size="19" fill="#aeb7bf">2015年・Kickstarterでの30日間</text><g fill="#191b1f" stroke="#3e4348"><rect x="26" y="122" width="275" height="174" rx="8"/><rect x="343" y="122" width="275" height="174" rx="8"/><rect x="660" y="122" width="274" height="174" rx="8"/></g><g text-anchor="middle"><text x="164" y="175" font-size="20" fill="#b7bec6">目標額</text><text x="164" y="226" font-size="31" fill="#fff" font-weight="700">1万ドル</text><text x="480" y="175" font-size="20" fill="#b7bec6">支援者数</text><text x="480" y="226" font-size="31" fill="#ffab46" font-weight="700">219,382人</text><text x="797" y="175" font-size="20" fill="#b7bec6">支援金</text><text x="797" y="226" font-size="31" fill="#fff" font-weight="700">約878万ドル</text></g><text x="28" y="335" font-size="19" fill="#f1bd7c">支援金は製造・配送などに使う資金で、利益ではない。</text><text x="28" y="366" font-size="16" fill="#a8aeb6">出典：Kickstarter公式キャンペーン（独自図解）</text></g></svg>
