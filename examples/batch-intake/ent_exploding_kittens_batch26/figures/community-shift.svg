<svg xmlns="http://www.w3.org/2000/svg" width="680" height="837" viewBox="0 0 680 837" role="img" aria-labelledby="title desc"><title id="title">SNSの拡散から、参加型の企画へ</title><desc id="desc">漫画家のSNS紹介、支援の鈍化、参加型の写真企画、支援者による拡散の順</desc><rect width="680" height="837" fill="#0c0e11"/><g font-family='-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif'><text x="25" y="55" fill="#f5f6f8" font-size="34" font-weight="750">SNSの拡散から、参加型の企画へ</text><text x="25" y="95" fill="#aeb6bd" font-size="27">支援者自身が宣伝する流れを作った</text><rect x="25" y="146" width="630" height="125" rx="11" fill="#191d21" stroke="#3a4045"/>
 <text x="46" y="193" fill="#ffad49" font-size="32" font-weight="700">01</text><text x="111" y="194" fill="#fff" font-size="32" font-weight="700">漫画家がSNSで告知</text><text x="111" y="237" fill="#b5c0c9" font-size="29">The Oatmealの読者へ届ける</text><text x="322" y="297" font-size="24" fill="#ffad49">↓</text><rect x="25" y="300" width="630" height="125" rx="11" fill="#191d21" stroke="#3a4045"/>
 <text x="46" y="347" fill="#ffad49" font-size="32" font-weight="700">02</text><text x="111" y="348" fill="#fff" font-size="32" font-weight="700">開始4日で支援が減速</text><text x="111" y="391" fill="#b5c0c9" font-size="29">初期のファンには届いた</text><text x="322" y="451" font-size="24" fill="#ffad49">↓</text><rect x="25" y="454" width="630" height="125" rx="11" fill="#191d21" stroke="#3a4045"/>
 <text x="46" y="501" fill="#ffad49" font-size="32" font-weight="700">03</text><text x="111" y="502" fill="#fff" font-size="32" font-weight="700">参加型のお題を公開</text><text x="111" y="545" fill="#b5c0c9" font-size="29">写真やイベントに参加してもらう</text><text x="322" y="605" font-size="24" fill="#ffad49">↓</text><rect x="25" y="608" width="630" height="125" rx="11" fill="#191d21" stroke="#3a4045"/>
 <text x="46" y="655" fill="#ffad49" font-size="32" font-weight="700">04</text><text x="111" y="656" fill="#fff" font-size="32" font-weight="700">支援者が作品を投稿</text><text x="111" y="699" fill="#b5c0c9" font-size="29">投稿がまた次の話題になる</text><text x="25" y="796" fill="#909ba4" font-size="18">出典：共同制作者Elan Leeの2015年インタビュー</text></g></svg>
